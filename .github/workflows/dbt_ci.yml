name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery==1.8.0

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_CREDENTIALS }}' > ${{ github.workspace }}/gcp-key.json

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << PROFILE
          fraud_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: stripe-fraud-analytics
                dataset: dbt_ci
                keyfile: ${{ github.workspace }}/gcp-key.json
                threads: 4
                timeout_seconds: 300
                location: US
          PROFILE

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt parse
        working-directory: dbt_project
        run: dbt parse

      - name: dbt compile
        working-directory: dbt_project
        run: dbt compile

      - name: dbt test — staging
        working-directory: dbt_project
        run: dbt test --select staging
